title: "Copilot Studio Lab — 중급"
description: >-
  Copilot Studio 중급 교안. HR 채용 자동화를 소재로 커넥터·에이전트 흐름·
  승인·토픽을 랩 7개(220분)로 다루는 2일차 과정입니다.

# 배포는 .github/workflows/pages.yml (Actions) 이 한다 — just-the-docs 는 gem 테마라
# Pages 기본 빌드로는 안 올라간다. baseurl 은 워크플로가 실제 경로로 덮어쓴다.
baseurl: "/cs_lab_adv"
url: "https://jm-2ktech.github.io"

# 실습 환경 이름 — 회차·테넌트마다 바뀐다. 본문은 {{ site.lab_env }} 로만 참조한다.
# 여기만 고치면 랩 본문이 따라온다. 스크린샷 속 글자는 따라오지 않는다 — 재촬영 대상이다.
lab_env: "교육"

theme: just-the-docs
plugins:
  - jekyll-feed

# 코드블록 복사 버튼 — 테마 기본값도 true지만, 이 교안은 복붙이 주 동작이라 명시해 둔다.
# 버튼 스타일(상시 노출·다크 배경 대응)은 _sass/custom/custom.scss에 있다.
enable_copy_code_button: true

search_enabled: true
search:
  heading_level: 2
  previews: 3

mermaid:
  version: "10.9.1"

aux_links:
  "Microsoft Learn Copilot Studio":
    - "https://learn.microsoft.com/ko-kr/microsoft-copilot-studio/"

nav_sort: order
color_scheme: light

# ★ 필수 — 전 페이지 기본 레이아웃 (없으면 테마 미적용 = 맨 HTML 렌더링)
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Just the Docs callouts — 본문의 {: .note } / {: .warning } / {: .important } / {: .time } 렌더링 정의
callouts_level: quiet
callouts:
  note:
    title: 팁
    color: blue
  time:
    title: 시간
    color: green
  warning:
    title: 주의
    color: red
  important:
    title: 핵심
    color: yellow

# 빌드 제외
exclude:
  - _instructions/
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
